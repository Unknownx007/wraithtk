[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wraithtk"
version = "0.1.0"
description = "WraithTK — WebSocket security toolkit. By DEDSEC."
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "DEDSEC" }]
dependencies = [
    "websockets>=12.0",
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
wraithtk = "wraithtk.cli:main"

[tool.setuptools.packages.find]
include = ["wraithtk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
